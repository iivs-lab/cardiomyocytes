# No filtering: each frame is read as stored.
#
# A kernel rather than an absent one, so this option has the same shape as the
# rest and can sit in a sweep list, which `~data/transforms/filtering@<key>`
# cannot:
#
#   --multirun data/transforms/filtering@filter=identity,median_cuboid_1x1x1
#
# The group has to be named in full. `filter=identity` is a value override,
# which puts the string there and fails on the way into the kernel.
_target_: iivs_cardio.data.transforms.filtering.kernel.identity.IdentityConfig
