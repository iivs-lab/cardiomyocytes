# @package _global_

defaults:
  - _self_
  - /compute@compute: cpu
  - /filter@filter: median_ellipsoid_2x2x2

run_root: ???

source:
  root: ???
  subpath: null
  frames:
    start: 0
    step: 1
    count: null
    if_short: take

select:
  include: null
  exclude: null

target:
  frames:
    save: false
    subpath: null
    record_file: source
    if_present: error
    if_unsourced: keep
  ranges:
    save: true
    file: value_range
    if_present: error
    if_unsourced: keep

hydra:
  run:
    dir: ${run_root}
  sweep:
    dir: ${run_root}
    subdir: ${hydra.job.num}
  job_logging:
    formatters:
      simple:
        format: "[%(asctime)s][%(name)s][%(levelname)-8s] - %(message)s"
