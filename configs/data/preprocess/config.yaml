# @package _global_

defaults:
  - _self_
  - /compute@compute: cpu
  - /filter@filter: median_ellipsoid_2x2x2

source:
  root: ??? # the folder to search for phase .bin sequences
  subpath: null # a sequence's path in its time-lapse; null takes Koala's Phase/Float/Bin
  frames: # per tree: two trees at different rates reach one rate by different steps
    start: 0 # the first source frame to take
    step: 1 # take every step'th from there
    count: null # at most this many after the stride; null takes them all
    if_fewer: take # take | error (only where count is set)

select:
  include: null # a file of subpaths, or the subpaths as a list; null takes all
  exclude: null # same, for sequences to skip

target:
  root: ??? # where the job directory goes; a sweep puts each job under it by number
  subpath: null # a written sequence's frame folder; null follows source.subpath
  save_frames: false # the filtered frames as a .bin tree, laid out like the source
  save_ranges: true # one JSON of the dataset, sequence, and frame ranges
  range_file: value_range # `.json` is added if absent
  if_frames_exist: error # error | overwrite | reuse
  if_ranges_exist: error # error | overwrite | reuse
  if_sources_gone: keep # keep | delete (outputs the source no longer has)

hydra:
  run:
    dir: ${target.root} # pinned, not timestamped: a re-run needs an `if_*_exist`
  sweep:
    dir: ${target.root}
    subdir: ${hydra.job.num} # a group override's `/` would nest the job directories
  job_logging:
    formatters:
      simple: # the level is padded so the message column holds across levels
        format: "[%(asctime)s][%(name)s][%(levelname)-8s] - %(message)s"
